services:
  postgres:
    image: postgres:16-alpine
    container_name: taichi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taichi
      POSTGRES_PASSWORD: taichi
      POSTGRES_DB: taichi
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - taichi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taichi -d taichi"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  taichi-postgres-data:
